name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore OrderManagement.slnx

      - name: Build
        run: dotnet build OrderManagement.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test OrderManagement.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend tests (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web.React
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Web.React/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run